apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: crewmeister-challenge
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: crewmeister-challenge
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleDown:
      policies:
      - periodSeconds: 60
        type: Pods
        value: 1
      selectPolicy: Min
      stabilizationWindowSeconds: 60
    scaleUp:
      policies:
      - periodSeconds: 100
        type: Pods
        value: 1
      selectPolicy: Min
      stabilizationWindowSeconds: 100
