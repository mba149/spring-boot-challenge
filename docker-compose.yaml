name: crewmeister
services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_DATABASE: crewneisterchallenge
      MYSQL_ROOT_USER: root
      MYSQL_ROOT_PASSWORD: dev
      MYSQL_ROOT_HOST: "%"
      MYSQL_USER: docker-user
      MYSQL_PASSWORD: docker-pw
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password --bind-address=0.0.0.0 --skip-host-cache --skip-name-resolve
    volumes:
      - mysql_data:/var/lib/mysql

  crewmeister-app:
    image: crewmeister-challenge-app
    container_name: crewmeister-challenge-app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - DOCKER_BUILDKIT=1
    environment:
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: dev
      SPRING_DATASOURCE_HOST: host.docker.internal
      SPRING_DATASOURCE_PORT: 3306
      SPRING_DATASOURCE_DB_NAME: crewneisterchallenge
      SPRING_FLYWAY_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      - mysql-db

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:11.5.2
    container_name: grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml

volumes:
  mysql_data:
